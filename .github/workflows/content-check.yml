name: Content Check Issue

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN で作成した Issue は無限ループ防止により他のワークフローをトリガーしない。
      # claude.yml を起動させるため PAT を使用する。
      - name: Create content check issue
        env:
          GH_TOKEN: ${{ secrets.ISSUE_PAT }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BODY=$(printf '@claude\n\n%s' "$(sed '1,/^---$/d' .github/ISSUE_TEMPLATE/content-check.md)")
          echo "${BODY}" | gh issue create \
            --title "Scheduled content check ${DATE}" \
            --body-file - \
            --label "documentation" \
            --assignee "hitsujiwool"
