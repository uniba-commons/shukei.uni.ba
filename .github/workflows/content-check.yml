name: Content Check Issue

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create content check issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y-%m-%d)
          sed '1,/^---$/d' .github/ISSUE_TEMPLATE/content-check.md | gh issue create \
            --title "Scheduled content check ${DATE}" \
            --body-file - \
            --label "documentation" \
            --assignee "copilot"
